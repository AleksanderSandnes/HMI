version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
  - package-ecosystem: "docker"
    directory: "/backend/growattAPI"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "build"
  # Maven backend (growattAPI, Spring Boot / Java 17)
  - package-ecosystem: "maven"
    directory: "/backend/growattAPI"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "deps(growattAPI)"
    labels:
      - "dependencies"
      - "java"

  # npm frontend (Expo / React Native)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "deps(frontend)"
    labels:
      - "dependencies"
      - "javascript"
