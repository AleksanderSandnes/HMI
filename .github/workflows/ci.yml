name: CI

on:
  push:
    branches:
      - main
      - test
      - "task/**"
  pull_request:
    branches:
      - main
      - test

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-tooling:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test scripts/release/*.test.mjs
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: supabase/setup-cli@v1
        with:
          version: 2.118.0
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Isolate CI stack ports
        run: |
          # Hosted runners can already have services on the default 5432x ports.
          sed -i 's/5432/5732/g' supabase/config.toml
      - name: Start disposable stack with repository migrations
        run: supabase start --exclude realtime,imgproxy,mailpit,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
      - name: Verify account deletion through real Auth, Storage and Vault
        run: deno run --allow-env --allow-net --allow-run --allow-read supabase/tests/account_deletion_http.ts .
      - name: Stop stack
        if: always()
        run: supabase stop --no-backup
  edge-security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check supabase/functions/*/index.ts
      - run: deno test --allow-env supabase/functions/_shared/*_test.ts
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/growattAPI
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - run: mvn --batch-mode verify
      - name: Report backend coverage
        if: always()
        run: |
          python3 <<'PY'
          import os
          import xml.etree.ElementTree as ET
          report = ET.parse('target/site/jacoco/jacoco.xml').getroot()
          rows = ['## Java backend coverage', '', '| Metric | Coverage | Covered / total |', '| --- | --- | --- |']
          for counter in report.findall('counter'):
              covered = int(counter.attrib['covered'])
              total = covered + int(counter.attrib['missed'])
              percentage = 100 * covered / total if total else 100
              rows.append(f"| {counter.attrib['type']} | {percentage:.2f}% | {covered} / {total} |")
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('\n'.join(rows) + '\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: backend/growattAPI/target/site/jacoco
          if-no-files-found: error

  build:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_DATA_MODE: production
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: build-validation-placeholder
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build --workspace @hmi/core
      - run: npm run build --workspace @hmi/web

  # Lint each package with its own command, selected per package:
  #   @hmi/core → eslint src · @hmi/web → eslint · @hmi/mobile → eslint .
  lint:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - "@hmi/core"
          - "@hmi/web"
          - "@hmi/mobile"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint --workspace ${{ matrix.package }}

  # Run the test suites (core/web Vitest, mobile jest-expo) on commits to
  # main and test.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test
      - name: Report core coverage
        if: always()
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'packages/core/coverage/coverage-summary.json';
          if (!fs.existsSync(path)) {
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, 'Core coverage report was not produced.\n');
            process.exit(0);
          }
          const { total } = JSON.parse(fs.readFileSync(path, 'utf8'));
          const rows = ['## Shared core coverage', '', '| Metric | Coverage | Covered / total |', '| --- | --- | --- |'];
          for (const metric of ['lines', 'branches', 'functions', 'statements']) {
            const value = total[metric];
            rows.push(`| ${metric} | ${value.pct}% | ${value.covered} / ${value.total} |`);
          }
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, rows.join('\n') + '\n');
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-coverage
          path: packages/core/coverage
          if-no-files-found: warn

  # Preserve the rest of the quality gate (Prettier + typecheck) so it does not
  # regress alongside the per-package lint + test jobs.
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck
