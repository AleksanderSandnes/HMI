name: CI

on:
  push:
    branches:
      - main
      - test
      - "task/**"
  pull_request:
    branches:
      - main
      - test

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  edge-security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check supabase/functions/*/index.ts
      - run: deno test --allow-env supabase/functions/_shared/*_test.ts
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/growattAPI
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - run: mvn --batch-mode verify

  build:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_DATA_MODE: production
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: build-validation-placeholder
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build --workspace @hmi/core
      - run: npm run build --workspace @hmi/web

  # Lint each package with its own command, selected per package:
  #   @hmi/core → eslint src · @hmi/web → eslint · @hmi/mobile → eslint .
  lint:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - "@hmi/core"
          - "@hmi/web"
          - "@hmi/mobile"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint --workspace ${{ matrix.package }}

  # Run the test suites (core/web Vitest, mobile jest-expo) on commits to
  # main and test.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test

  # Preserve the rest of the quality gate (Prettier + typecheck) so it does not
  # regress alongside the per-package lint + test jobs.
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck
